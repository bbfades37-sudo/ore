<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>GSAP Single Image Sequence</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:300vh;
  background:#000;
  overflow-x:hidden;
  font-family:Arial,sans-serif;
}

.sequence-section{
  position:fixed;
  inset:0;
  width:100%;
  height:100vh;
  overflow:hidden;
  background:#000;
}

/* ONLY ONE IMAGE ACTIVE */
.seq{
  position:absolute;

  width:45vw;
  max-width:750px;

  top:50%;
  left:50%;

  transform:translate(-50%, -50%);

  opacity:0;

  will-change:transform, opacity;
}
</style>
</head>

<body>

<div class="sequence-section">
  <img src="images/1.png" class="seq">
  <img src="images/2.png" class="seq">
  <img src="images/3.png" class="seq">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

const images = document.querySelectorAll(".seq");

/*
INITIAL STATE:
Everything hidden except first frame handled by scroll
*/
images.forEach((img) => {
  gsap.set(img, {
    x: 400,
    scale: 0.6,
    opacity: 0
  });
});

images.forEach((img, i) => {

  const next = images[i + 1];

  const tl = gsap.timeline({
    scrollTrigger: {
      trigger: "body",
      start: `top+=${i * window.innerHeight} top`,
      end: `top+=${(i + 1) * window.innerHeight} top`,
      scrub: true
    }
  });

  /* STAGE 1: RIGHT → CENTER (scale up to 1) */
  tl.fromTo(img,
    {
      x: 400,
      scale: 0.7,
      opacity: 1
    },
    {
      x: 0,
      scale: 1,
      opacity: 1,
      ease: "none",
      duration: 0.5
    }
  )

  /* STAGE 2: CENTER → LEFT (scale down slightly) */
  .to(img, {
    x: -400,
    scale: 0.75,
    ease: "none",
    duration: 0.5
  });

  /* NEXT IMAGE APPEAR */
  if(next){

    gsap.fromTo(next,
      {
        x: 400,
        scale: 0.7,
        opacity: 0
      },
      {
        x: 0,
        scale: 1,
        opacity: 1,
        ease: "none",
        scrollTrigger: {
          trigger: "body",
          start: `top+=${i * window.innerHeight} top`,
          end: `top+=${(i + 1) * window.innerHeight} top`,
          scrub: true
        }
      }
    );
  }

});
</script>

</body>
</html>
