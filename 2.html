
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>GSAP DOM Image Sequence</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:400vh;
  background:#000;
  overflow-x:hidden;
  font-family:Arial,sans-serif;
}

.sequence-section{
  position:fixed;
  inset:0;
  width:100%;
  height:100vh;
  overflow:hidden;
}

.sequence-section img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;

  opacity:0;
  will-change:opacity;
}

.sequence-section img.active{
  opacity:1;
}

.content{
  position:relative;
  z-index:10;
  color:white;
  text-align:center;
  padding-top:120vh;
  font-size:3rem;
}
</style>
</head>

<body>

<div class="sequence-section">

  <!-- IMAGE 1 -->
  <img src="images/1.png" class="seq active">

  <!-- IMAGE 2 -->
  <img src="images/2.png" class="seq">

  <!-- IMAGE 3 -->
  <img src="images/3.png" class="seq">

</div>

<div class="content">
  <h1>Scroll Down</h1>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

const images = document.querySelectorAll(".seq");

let current = 0;

ScrollTrigger.create({
  trigger: "body",
  start: "top top",
  end: "bottom bottom",
  scrub: 1,

  onUpdate: self => {

    const progress = self.progress;

    // 0 → 2
    const index = Math.round(progress * (images.length - 1));

    if(index !== current){

      gsap.to(images[current], {
        opacity:0,
        duration:0.3
      });

      gsap.to(images[index], {
        opacity:1,
        duration:0.3
      });

      current = index;
    }
  }
});
</script>

</body>
</html>
