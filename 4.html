<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>GSAP DOM Sequence</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:400vh;
  background:#000;
  overflow-x:hidden;
  font-family:Arial,sans-serif;
}

.sequence-section{
  position:fixed;
  inset:0;
  width:100%;
  height:100vh;
  overflow:hidden;
  background:#000;
}

/* IMAGE */
.seq{
  position:absolute;

  /* smaller image size */
  width:42vw;
  max-width:700px;

  top:50%;
  left:50%;

  transform:
    translate(-50%, -50%)
    scale(0.9);

  opacity:0;

  object-fit:contain;

  will-change:transform, opacity;
}

.content{
  position:relative;
  z-index:10;
  color:white;
  padding-top:130vh;
  text-align:center;
  font-size:3rem;
}
</style>
</head>

<body>

<div class="sequence-section">

  <img src="images/1.png" class="seq">
  <img src="images/2.png" class="seq">
  <img src="images/3.png" class="seq">

</div>

<div class="content">
  <h1>Scroll Down</h1>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

const images = document.querySelectorAll(".seq");

/*
ANIMATION FLOW

Current image:
LEFT -> CENTER -> RIGHT
while scaling DOWN

Next image:
starts smaller
then scales UP in center
*/

images.forEach((img, i) => {

  gsap.set(img,{
    x:300,
    scale:0.75,
    opacity:0
  });

});

images.forEach((img, i) => {

  const tl = gsap.timeline({
    scrollTrigger:{
      trigger:"body",
      start:`top+=${i * window.innerHeight} top`,
      end:`top+=${(i + 1) * window.innerHeight} top`,
      scrub:1
    }
  });

  tl

  /* ENTER FROM LEFT */
  .fromTo(img,
    {
      x:-350,
      scale:1.1,
      opacity:0
    },
    {
      x:0,
      scale:0.9,
      opacity:1,
      ease:"none",
      duration:0.5
    }
  )

  /* EXIT TO RIGHT + SCALE DOWN */
  .to(img,{
    x:350,
    scale:0.65,
    opacity:0,
    ease:"none",
    duration:0.5
  });

});


/* NEXT IMAGE SCALE UP EFFECT */

images.forEach((img, i) => {

  if(i === 0) return;

  gsap.fromTo(img,
    {
      scale:0.55,
      opacity:0
    },
    {
      scale:0.9,
      opacity:1,
      ease:"none",
      scrollTrigger:{
        trigger:"body",
        start:`top+=${(i * window.innerHeight) - 300} top`,
        end:`top+=${i * window.innerHeight} top`,
        scrub:1
      }
    }
  );

});
</script>

</body>
</html>
